stages:
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

test:
  stage: test
  image: python:3.11-slim
  services:
    - postgres:15
  variables:
    POSTGRES_DB: aegis_test
    POSTGRES_USER: aegis_user
    POSTGRES_PASSWORD: test_password
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: postgresql://aegis_user:test_password@postgres:5432/aegis_test
    JWT_SECRET_KEY: ci-test-secret
    REQUIRE_DATABASE: "1"
    IO_RETRY_WAIT_SECONDS: "0.05"
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - python - <<'PY'
      import os, time
      import psycopg2
      from pathlib import Path
      last = None
      for _ in range(30):
          try:
              conn = psycopg2.connect(os.environ["DATABASE_URL"])
              conn.autocommit = True
              cur = conn.cursor()
              cur.execute(Path("init.sql").read_text())
              conn.close()
              break
          except Exception as exc:
              last = exc
              time.sleep(1)
      else:
          raise SystemExit(f"postgres not ready: {last}")
      PY
    - alembic upgrade head
  script:
    - pytest -q tests/

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache openssh-client
    - echo "$DEPLOY_KEY" > deploy_key.pem
    - chmod 600 deploy_key.pem
    - ssh -i deploy_key.pem -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "docker pull $DOCKER_IMAGE && docker-compose up -d"
  only:
    - main