name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  offline-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis123
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aegis:aegis123@localhost:5432/aegis
      JWT_SECRET_KEY: ci-test-secret
      IO_RETRY_WAIT_SECONDS: "0.05"
      REQUIRE_DATABASE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply base schema (Sprint 0)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=aegis123 psql -h localhost -U aegis -d aegis -f init.sql

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Offline + PostgreSQL tests (no live Yahoo)
        run: |
          pytest -q tests/ \
            --cov=worker \
            --cov-report=term-missing

      - name: Worker smoke (offline collect and idempotent repeat)
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from worker.config import WorkerSettings
          from worker.repository import create_engine

          async def clean():
              engine = create_engine(WorkerSettings())
              async with engine.begin() as conn:
                  await conn.execute(text("DELETE FROM market_quote_revisions"))
                  await conn.execute(text("DELETE FROM market_quote_quarantine"))
                  await conn.execute(text("DELETE FROM market_quotes"))
                  await conn.execute(text("DELETE FROM market_collection_runs"))
              await engine.dispose()

          asyncio.run(clean())
          PY
          python -m worker collect \
            --provider offline \
            --symbols AAPL,MSFT,NVDA \
            --start 2024-01-02 \
            --end 2024-01-06 > /tmp/first.json
          python -m worker collect \
            --provider offline \
            --symbols AAPL,MSFT,NVDA \
            --start 2024-01-02 \
            --end 2024-01-06 > /tmp/second.json
          python - <<'PY'
          import json
          first = json.load(open("/tmp/first.json"))
          second = json.load(open("/tmp/second.json"))
          assert first["status"] == "READY", first
          assert first["counters"]["inserted"] == 12, first["counters"]
          assert second["status"] == "READY", second
          assert second["counters"]["inserted"] == 0, second["counters"]
          assert second["counters"]["duplicates"] == 12, second["counters"]
          print(first["status"], first["counters"], second["counters"])
          PY
