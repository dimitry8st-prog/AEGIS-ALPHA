global
    maxconn 128

defaults
    mode tcp
    timeout connect 5s
    timeout client  5m
    timeout server  5m

resolvers docker
    nameserver embedded 127.0.0.11:53
    hold valid 10s

listen postgres
    bind :15432
    server postgres postgres:5432 resolvers docker init-addr libc,none

listen redis
    bind :16379
    server redis redis:6379 resolvers docker init-addr libc,none
