<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="780" viewBox="0 0 1800 780"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#193b63"/></marker></defs>
<text x="45" y="28" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#142d4f" dominant-baseline="hanging">AEGIS Alpha | 2. Подпроцесс сбора одного потока</text>
<text x="45" y="78" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#142d4f" dominant-baseline="hanging">Вызывается для news и quotes. Возвращает итог всегда; отказ одного потока не блокирует параллельное соединение.</text>
