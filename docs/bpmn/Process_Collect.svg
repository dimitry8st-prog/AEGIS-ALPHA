<text x="1534.0" y="289" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">OK / PARTIAL / EMPTY</text>
<ellipse cx="774.0" cy="524.0" rx="24.0" ry="24.0" fill="white" stroke="#193b63" stroke-width="4"/>
<text x="774.0" y="573" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">Итог потока:</text>
<text x="774.0" y="599" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">UNAVAILABLE</text>
<text x="45" y="695" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#142d4f" dominant-baseline="hanging">Круг — событие · толстый круг — результат · × — выбор · + — параллельность</text>
<text x="45" y="725" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#142d4f" dominant-baseline="hanging">Толстый блок — вызываемый подпроцесс · ≡ — последовательная обработка каждой записи</text>
</svg>