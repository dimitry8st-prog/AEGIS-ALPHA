<text x="94.0" y="263" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">Получен</text>
<text x="94.0" y="289" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">контекст потока</text>
<rect x="190" y="170" width="260" height="90" rx="12" fill="#eef5fc" stroke="#193b63" stroke-width="4"/>
<text x="320.0" y="196.5" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">Получить данные</text>
<text x="320.0" y="223.5" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">через адаптер</text>
<polyline points="545.0,190 570,215.0 545.0,240 520,215.0 545.0,190" fill="none" stroke="#193b63" stroke-width="2"/>
<polygon points="545.0,190 570,215.0 545.0,240 520,215.0" fill="#fff3dc" stroke="#193b63" stroke-width="2"/>
<text x="545.0" y="215.0" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">×</text>
<text x="545.0" y="125" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">Чтение</text>
<text x="545.0" y="150" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">успешно?</text>
<rect x="680" y="170" width="310" height="100" rx="12" fill="#eef5fc" stroke="#193b63" stroke-width="4"/>
<text x="835.0" y="201.5" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">Проверить и сохранить</text>
<text x="835.0" y="228.5" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">каждую запись</text>
<text x="835.0" y="256" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">≡</text>
