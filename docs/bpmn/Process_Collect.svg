<text x="1240.0" y="196.5" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">Подсчитать записи</text>
<text x="1240.0" y="223.5" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#142d4f" text-anchor="middle" dominant-baseline="middle">и покрытие окна</text>
<ellipse cx="1534.0" cy="214.0" rx="24.0" ry="24.0" fill="white" stroke="#193b63" stroke-width="4"/>
