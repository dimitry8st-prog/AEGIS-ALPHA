<text x="610" y="180" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#142d4f" dominant-baseline="hanging">Да</text>
<polyline points="545,240 545,524 750,524" fill="none" stroke="#193b63" stroke-width="2" marker-end="url(#arrow)"/>
<text x="555" y="370" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#142d4f" dominant-baseline="hanging">Нет</text>
<polyline points="990,215 1100,215" fill="none" stroke="#193b63" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1380,215 1510,215" fill="none" stroke="#193b63" stroke-width="2" marker-end="url(#arrow)"/>
